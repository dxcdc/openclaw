{% extends 'layout-vertical.html' %}
{% load static i18n %}

{% block title %}Chat Nativo do Agente OpenClaw{% endblock %}

{% block page_content %}
<!-- HEADER DO CHAT DIRETO -->
<div class="row mb-3">
  <div class="col-12">
    <div class="card border-0 shadow-sm bg-white rounded-4 p-3.5">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
        
        <div class="d-flex align-items-center gap-3">
          <div class="p-2 bg-danger-subtle rounded-circle d-flex align-items-center justify-content-center">
            <img src="{% static '/images/openclaw-icon-md.png' %}" alt="OpenClaw Mascot" style="height: 42px; width: 42px;" class="img-fluid">
          </div>
          <div>
            <div class="d-flex align-items-center gap-2 mb-1">
              <span class="badge bg-danger text-white fw-bold px-2.5 py-0.5 rounded-pill fs-11">CHAT DIRETO NATIVO</span>
              <span class="badge bg-success-subtle text-success border border-success-subtle px-2.5 py-0.5 rounded-pill fs-11">
                🟢 Session: agent:main:main
              </span>
            </div>
            <h3 class="h4 fw-extrabold text-dark mb-0">Conversa com o Agente OpenClaw</h3>
          </div>
        </div>

        <div class="d-flex align-items-center gap-2">
          <a href="{{ chat_url }}" target="_blank" class="btn btn-danger fw-bold px-3 shadow-sm">
            💬 Abrir Chat em Nova Aba ↗
          </a>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- IFRAME DO CHAT DIRETO NATIVO -->
<div class="row">
  <div class="col-12">
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
      <div class="card-body p-0">
        <div style="height: 750px; width: 100%; position: relative;">
          <iframe src="{{ chat_url }}" style="width: 100%; height: 100%; border: none;" title="OpenClaw Direct Chat"></iframe>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock page_content %}
